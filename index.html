/* =========================================================
   LOCAL STORAGE
========================================================= */

const KEY = "km-gifts-v4";

function loadLocal() {
  try {
    return JSON.parse(localStorage.getItem(KEY)) || null;
  } catch {
    return null;
  }
}

function saveLocal(data) {
  try {
    localStorage.setItem(KEY, JSON.stringify(data));
  } catch {}
}


/* =========================================================
   JSONP / REMOTE SYNC
========================================================= */

function jsonp(url) {

  return new Promise((resolve, reject) => {

    const cb =
      "kmJSONPcb_" +
      Date.now() +
      "_" +
      Math.random().toString(36).slice(2);

    let finished = false;

    const cleanup = () => {
      try {
        delete window[cb];
      } catch {}

      script.remove();
    };

    window[cb] = function(data) {

      if (finished) return;

      finished = true;

      cleanup();

      resolve(data);
    };

    const script =
      document.createElement("script");

    script.src =
      url +
      (url.includes("?") ? "&" : "?") +
      "callback=" +
      encodeURIComponent(cb) +
      "&_t=" +
      Date.now();

    script.onerror = () => {

      if (finished) return;

      finished = true;

      cleanup();

      reject(
        new Error("JSONP error")
      );
    };

    document.head.appendChild(script);

    setTimeout(() => {

      if (finished) return;

      finished = true;

      cleanup();

      reject(
        new Error("JSONP timeout")
      );

    }, 12000);

  });
}


async function loadRemote() {

  try {

    return await jsonp(
      CONFIG.syncEndpoint
    );

  } catch {

    return null;

  }
}


async function saveRemote(data) {

  try {

    const response =
      await fetch(
        CONFIG.syncEndpoint,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "text/plain;charset=utf-8"
          },

          body:
            JSON.stringify(data)
        }
      );

    return response.ok;

  } catch {

    return false;

  }
}


/* =========================================================

/* =========================================================
   MONEY
========================================================= */

function formatMoney(n) {

  return new Intl.NumberFormat(
    undefined,
    {
      style: "currency",
      currency: CONFIG.currency
    }
  ).format(n);

}


/* =========================================================
   SEARCH / SORT
========================================================= */

function getFilteredSorted(arr) {

  let out =
    [...arr];


  const q =
    (($search && $search.value) || "")
      .trim()
      .toLowerCase();


  if (q) {

    out =
      out.filter(it =>

        [
          it.name,
          it.size,
          it.color
        ].some(s =>

          String(s || "")
            .toLowerCase()
            .includes(q)

        )

      );

  }


  const sortVal =
    (($sort && $sort.value) ||
      "default");


  switch (sortVal) {

    case "price-asc":

      out.sort(
        (a,b) =>
          Number(a.cost || 0) -
          Number(b.cost || 0)
      );

      break;


    case "price-desc":

      out.sort(
        (a,b) =>
          Number(b.cost || 0) -
          Number(a.cost || 0)
      );

      break;


    case "name":

      out.sort(
        (a,b) =>
          String(a.name)
            .localeCompare(
              String(b.name)
            )
      );

      break;


    case "status":

      out.sort(
        (a,b) =>
          Number(a.purchased) -
          Number(b.purchased)
      );

      break;


    /*
      No sorting is necessary for
      "Original".

      This is important because
      Console-added items may not
      exist in INITIAL_ITEMS.
    */

    default:
      break;

  }


  return out;

}

/* =========================================================
   RENDER
========================================================= */

function render() {

  const items =
    getFilteredSorted(
      state.items
    );


  $items.innerHTML =
    items
      .map(cardHTML)
      .join("");


  for (const it of items) {

    document
      .querySelector(
        `#mark-${it.id}`
      )
      ?.addEventListener(
        "click",
        () =>
          toggle(
            it.id,
            true
          )
      );


    document
      .querySelector(
        `#undo-${it.id}`
      )
      ?.addEventListener(
        "click",
        () =>
          toggle(
            it.id,
            false
          )
      );


    document
      .querySelector(
        `#copy-${it.id}`
      )
      ?.addEventListener(
        "click",
        () =>
          copy(it.link)
      );

  }

}


/* =========================================================
   STATUS
========================================================= */

function showSync(
  text,
  ok = true
) {

  if (!$syncStatus) return;


  $syncStatus.textContent =
    text;


  $syncStatus.className =
    ok
      ? "mt-2 text-[11px] text-emerald-600"
      : "mt-2 text-[11px] text-amber-600";

}


/* =========================================================
   PURCHASE STATUS
========================================================= */

async function toggle(
  id,
  purchased
) {

  const idx =
    state.items.findIndex(
      item =>
        item.id === id
    );


  if (idx < 0) return;


  state.items[idx].purchased =
    purchased;


  saveLocal(state);

  render();


  /*
    Prevent polling from immediately
    overwriting our own update.
  */

  lastPushTs =
    Date.now();


  showSync(
    "Saving…"
  );


  const ok =
    await saveRemote(state);


  showSync(
    ok
      ? "Changes saved for everyone"
      : "Could not sync – saved on this device",
    ok
  );

}


/* =========================================================
   COPY LINK
========================================================= */

async function copy(text) {

  try {

    await navigator.clipboard
      .writeText(text);


    toast(
      "Link copied"
    );

  } catch {

    toast(
      "Copy failed"
    );

  }

}


function toast(msg) {

  const el =
    document.createElement("div");


  el.textContent =
    msg;


  el.className =
    "fixed left-1/2 -translate-x-1/2 bottom-6 bg-slate-900 text-white text-sm px-3 py-2 rounded-lg shadow-lg";


  document.body
    .appendChild(el);


  setTimeout(
    () => el.remove(),
    1400
  );

}


/* =========================================================
   REMOTE POLLING

   IMPORTANT:
   The remote list is now allowed to contain
   items that are NOT in INITIAL_ITEMS.

   This is what makes Console additions persist.
========================================================= */

async function pollRemote() {

  if (document.hidden) {
    return;
  }


  /*
    Don't poll immediately after this
    browser saved something.
  */

  if (
    Date.now() -
    lastPushTs <
    5000
  ) {

    return;

  }


  const remote =
    await loadRemote();


  if (
    remote?.items &&
    Array.isArray(remote.items)
  ) {

    const localJson =
      JSON.stringify(
        state.items
      );


    const remoteJson =
      JSON.stringify(
        remote.items
      );


    if (
      remoteJson !==
      localJson
    ) {

      /*
        Remote list is the master.
        Do NOT filter against INITIAL_ITEMS.
      */

      state = {
        items:
          remote.items
      };


      saveLocal(state);

      render();


      showSync(
        "Updated just now"
      );

    }

  }

}


/* =========================================================
   POLLING
========================================================= */

function startPolling() {

  stopPolling();


  pollTimer =
    setInterval(
      pollRemote,
      CONFIG.pollMs
    );

}


function stopPolling() {

  if (pollTimer) {

    clearInterval(
      pollTimer
    );


    pollTimer =
      null;

  }

}


document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.hidden
    ) {

      stopPolling();

    } else {

      /*
        Check remote immediately when
        someone comes back to the tab.
      */

      pollRemote();

      startPolling();

    }

  }
);


/* =========================================================
   INITIAL SETUP

   NEW BEHAVIOR:

   1. If remote data exists:
      use remote data.

   2. If there is no remote data:
      use local data.

   3. If neither exists:
      use INITIAL_ITEMS.

   This allows Console-added gifts
   to remain in the remote database.
========================================================= */

async function setup() {

  $items =
    document.querySelector(
      "#items"
    );


  $search =
    document.querySelector(
      "#search"
    );


  $sort =
    document.querySelector(
      "#sort"
    );


  $syncStatus =
    document.querySelector(
      "#syncStatus"
    );


  $search.addEventListener(
    "input",
    render
  );


  $sort.addEventListener(
    "change",
    render
  );


  showSync(
    "Syncing…"
  );


  const remote =
    await loadRemote();


  /*
    REMOTE EXISTS:
    Use it exactly as stored.
  */

  if (
    remote?.items &&
    Array.isArray(remote.items) &&
    remote.items.length > 0
  ) {

    state = {
      items:
        remote.items
    };


    saveLocal(state);


    showSync(
      "Live sync enabled"
    );

  } else {

    /*
      No usable remote list.

      Try this browser's local copy.
    */

    const local =
      loadLocal();


    if (
      local?.items &&
      Array.isArray(local.items) &&
      local.items.length > 0
    ) {

      state = {
        items:
          local.items
      };

    } else {

      /*
        Brand-new setup:
        use the list embedded in GitHub.
      */

      state = {
        items:
          structuredClone(
            INITIAL_ITEMS
          )
      };

    }


    saveLocal(state);


    /*
      Create/restore the remote list.
    */

    lastPushTs =
      Date.now();


    const ok =
      await saveRemote(state);


    showSync(
      ok
        ? "Live sync enabled"
        : "Sync offline – saved on this device",
      ok
    );

  }


  render();

  startPolling();

}

   addGift({...})

   instead of the long code block each time.
========================================================= */

async function addGift(newItem) {

  if (
    !newItem ||
    !newItem.id ||
    !newItem.name
  ) {

    console.error(
      "Gift needs at least an id and name."
    );

    return false;

  }


  const existingIndex =
    state.items.findIndex(
      item =>
        item.id === newItem.id
    );


  const normalizedItem = {

    id:
      newItem.id,

    cost:
      Number(
        newItem.cost || 0
      ),

    name:
      newItem.name,

    size:
      newItem.size || "",

    color:
      newItem.color || "",

    link:
      newItem.link || "",

    linkLabel:
      newItem.linkLabel ||
      newItem.name,

    purchased:
      Boolean(
        newItem.purchased
      )

  };


  /*
    If the ID already exists,
    update that gift instead of
    creating a duplicate.
  */

  if (
    existingIndex >= 0
  ) {

    /*
      Preserve purchased status unless
      explicitly supplied.
    */

    if (
      typeof newItem.purchased !==
      "boolean"
    ) {

      normalizedItem.purchased =
        Boolean(
          state.items[
            existingIndex
          ].purchased
        );

    }


    state.items[
      existingIndex
    ] =
      normalizedItem;

  } else {

    state.items.push(
      normalizedItem
    );

  }


  saveLocal(state);

  render();


  lastPushTs =
    Date.now();


  showSync(
    "Saving…"
  );


  const ok =
    await saveRemote(state);


  showSync(
    ok
      ? "Changes saved for everyone"
      : "Could not sync – saved on this device",
    ok
  );


  if (ok) {

    console.log(
      "Gift saved:",
      normalizedItem
    );

  } else {

    console.error(
      "Gift saved locally but remote sync failed."
    );

  }


  return ok;

}


/* =========================================================
   OPTIONAL CONSOLE DELETE HELPER

   Example:
   removeGift("gift-id")
========================================================= */

async function removeGift(id) {

  const exists =
    state.items.some(
      item =>
        item.id === id
    );


  if (!exists) {

    console.warn(
      "Gift not found:",
      id
    );

    return false;

  }


  state.items =
    state.items.filter(
      item =>
        item.id !== id
    );


  saveLocal(state);

  render();


  lastPushTs =
    Date.now();


  showSync(
    "Saving…"
  );


  const ok =
    await saveRemote(state);


  showSync(
    ok
      ? "Gift removed for everyone"
      : "Could not sync deletion",
    ok
  );


  return ok;

}

   START
========================================================= */

if (
  document.readyState ===
  "loading"
) {

  document.addEventListener(
    "DOMContentLoaded",
    setup
  );

} else {

  setup();

}
