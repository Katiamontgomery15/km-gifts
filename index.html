<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Katia Xmas/Bday – Gift List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: light dark }
  html { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial }
  body{
    background-image:url('https://static.vecteezy.com/system/resources/previews/029/642/930/large_2x/christmas-background-christmas-landscape-background-christmas-wallpaper-landscape-background-ai-generative-free-photo.jpg');
    background-size:cover; background-position:center; background-repeat:no-repeat;
    min-height:100vh; background-attachment:fixed;
  }
  .bg-overlay{ background:rgba(255,255,255,.45); backdrop-filter: blur(6px) }
  .truncate-2{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden }
  .badge{ font-size:.65rem; padding:.2rem .45rem; border-radius:.5rem }
  /* keep gift links white (visited too) */
  .gift-card a, .gift-card a:visited { color:#fff; text-decoration-color:#fff; }
</style>
</head>
<body class="text-slate-900 dark:text-slate-100">
  <div class="bg-overlay max-w-5xl mx-auto p-4 md:p-8 rounded-2xl mt-6 shadow-lg">
    <header class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between mb-6">
      <div>
        <h1 class="text-2xl md:text-3xl font-bold">Katia Xmas/Bday</h1>
        <p class="text-xs mt-1">
          Amazon list:
          <a class="underline text-blue-600" href="https://www.amazon.com/hz/wishlist/ls/3DKWBJ9RAO80N?ref_=wl_share" target="_blank" rel="noopener">open wishlist</a>
        </p>
        <div id="syncStatus" class="mt-2 text-[11px] text-slate-500"></div>
      </div>
      <div class="flex gap-2 w-full md:w-auto">
        <input id="search" placeholder="Search items…" class="flex-1 md:w-72 px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white/70 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        <select id="sort" class="px-3 py-2 rounded-xl border border-slate-300 dark:border-slate-700 bg-white/70 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="default">Sort: Original</option>
          <option value="price-asc">Price: Low → High</option>
          <option value="price-desc">Price: High → Low</option>
          <option value="name">Name A→Z</option>
          <option value="status">Status</option>
        </select>
      </div>
    </header>

    <section id="items" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4"></section>

    <footer class="mt-10 text-xs text-slate-700 dark:text-slate-400">
      <p>Tip: Tap “Mark purchased” after you buy an item so others don’t duplicate it. No login needed.</p>
      <p class="mt-1">If you accidentally mark something, tap “Undo”.</p>
    </footer>
  </div>

<script>
// ---------- Config ----------
const CONFIG = {
  title: "Katia Xmas/Bday",
  // JSONP-enabled Apps Script endpoint:
  syncEndpoint: "https://script.google.com/macros/s/AKfycbzzKIxwHRbNuFPZYNcGPsJB5VRupmv51dfpEyXgVV6L_pLB4FY6vHoZHGeJ9cTV-OG9YQ/exec",
  allowUndo: true,
  currency: "USD",
  pollMs: 15000
};

// ---------- Starter Data ----------
const INITIAL_ITEMS = [
  {

    cost:46.00,

    link:"https://drsambunting.com/en-us/products/flawless-cleanser-refill",

  },

  {

  {

  {

  },

  {

    size:"L",
    color:"Black",
    link:"https://www.686.com/products/womens-waterproof-team-crop-hoody?variant=46113168556203",
    linkLabel:"Women's Waterproof Team Crop Hoody | 686",
    purchased:false
  },

  {
    id:"klim-rebelle-overalls",
    cost:299.99,
    name:"KLIM Women's Rebelle Over The Boot Overalls",
    size:"M",
    color:"Black",
    link:"https://www.motosport.com/klim-womens-rebelle-over-the-boot-overalls?variant%5BKLM1XG2%5D=KLM1XG2-X001-Y002",
    linkLabel:"KLIM Women's Rebelle Over The Boot Overalls | MotoSport",
    purchased:false
  },

  {
    id:"rdrco-octane-combo",
    cost:99.99,
    name:"RDRCO Women's Octane Combo - Burst",
    size:"Pants 10 / Jersey M / Gloves M",
    color:"Purple Sunset",
    link:"https://www.motosport.com/rdrco-womens-octane-combo-burst?variant%5BRDR003I%5D=RDR003I-X002-Y006&variant%5BRDR003G%5D=RDR003G-X002-Y003&variant%5BRDR003Q%5D=RDR003Q-X003-Y002",
    linkLabel:"RDRCO Women's Octane Combo - Burst | MotoSport",
    purchased:false
  },

  {
    id:"hoka-clifton-11-gtx",
    cost:175.00,
    name:"HOKA Women's Clifton 11 GTX",
    size:"7.5 Wide",
    color:"Black / Black",
    link:"https://www.hoka.com/en/us/womens-everyday-running-gear/clifton-11-gtx/1176575.html",
    linkLabel:"Women's Clifton 11 GTX | HOKA",
    purchased:false
  },

  {
    id:"levis-wedgie-indigo",
    cost:77.00,
    name:"Levi's Wedgie Straight Ankle Women's Jeans",
    size:"30W / 28L",
    color:"Indifferent Indigo - Dark Wash",
    link:"https://www.levi.com/US/en_US/clothing/women/jeans/straight/wedgie-straight-ankle-womens-jeans/p/349640217",
    linkLabel:"Wedgie Straight Ankle Women's Jeans | Levi's",
    purchased:false
  },

  {
    id:"gopro-max-lens-mod-2",
    cost:119.99,
    name:"GoPro Max Lens Mod 2.0",
    size:"",
    color:"Black",
    link:"https://gopro.com/en/us/shop/mounts-accessories/max-lens-mod-2/ADWAL-002.html",
    linkLabel:"Max Lens Mod 2.0 | GoPro",
    purchased:false
  },

  {
    id:"gopro-enduro-2-battery",
    cost:34.99,
    name:"GoPro Enduro 2 Battery",
    size:"2150mAh",
    color:"",
    link:"https://gopro.com/en/us/shop/mounts-accessories/enduro-2-battery/AGBAT-001.html",
    linkLabel:"Enduro 2 Battery | GoPro",
    purchased:false
  },

  {
    id:"gopro-enduro-2-charger",
    cost:79.99,
    name:"GoPro Dual Battery Charger + Enduro 2 Battery",
    size:"Includes 1 × 2150mAh Enduro 2 Battery",
    color:"",
    link:"https://gopro.com/en/us/shop/mounts-accessories/dual-battery-charger-enduro2-batteries/AGDBD-001-master.html",
    linkLabel:"Dual Battery Charger + Enduro 2 Battery | GoPro",
    purchased:false
  }
];

// ---------- Local Storage ----------
const KEY = "km-gifts-v2";
function loadLocal(){ try{ return JSON.parse(localStorage.getItem(KEY)) || null } catch{ return null } }
function saveLocal(d){ try{ localStorage.setItem(KEY, JSON.stringify(d)) } catch{} }

// ---------- JSONP helper (fixed callback name) ----------
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb = 'kmJSONPcb'; // fixed, reliable name
    window[cb] = function(data){ try{ resolve(data); } catch(e){} };
    const s  = document.createElement('script');
    s.src = url + (url.includes('?')?'&':'?') + 'callback=' + cb + '&_t=' + Date.now();
    s.onerror = ()=>{ reject(new Error('JSONP error')); s.remove(); };
    document.head.appendChild(s);
    setTimeout(()=>{ reject(new Error('JSONP timeout')); s.remove(); }, 12000);
  });
}
async function loadRemote(){ try{ return await jsonp(CONFIG.syncEndpoint); } catch{ return null } }
// Write using text/plain to avoid preflight
async function saveRemote(data){
  try{
    const r = await fetch(CONFIG.syncEndpoint, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(data)
    });
    return r.ok;
  }catch{ return false }
}

// ---------- State & DOM ----------
let state = { items: structuredClone(INITIAL_ITEMS) };
let lastPushTs = 0;
let pollTimer = null;
let $items,$search,$sort,$syncStatus;

function formatMoney(n){ return new Intl.NumberFormat(undefined,{style:'currency',currency:CONFIG.currency}).format(n) }

function getFilteredSorted(arr){
  let out=[...arr];
  const q=(($search&&$search.value)||'').trim().toLowerCase();
  if(q) out=out.filter(it=>[it.name,it.size,it.color].some(s=>String(s).toLowerCase().includes(q)));
  const sortVal=(($sort&&$sort.value)||'default');
  switch(sortVal){
    case 'price-asc': out.sort((a,b)=>a.cost-b.cost); break;
    case 'price-desc': out.sort((a,b)=>b.cost-a.cost); break;
    case 'name': out.sort((a,b)=>a.name.localeCompare(b.name)); break;
    case 'status': out.sort((a,b)=>Number(a.purchased)-Number(b.purchased)); break;
    default: out.sort((a,b)=>INITIAL_ITEMS.findIndex(x=>x.id===a.id)-INITIAL_ITEMS.findIndex(x=>x.id===b.id));
  }
  return out;
}

function cardHTML(it){
  return `
    <article class="gift-card rounded-2xl border border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/70 p-4 flex flex-col gap-3 shadow-sm">
      <div class="flex items-start justify-between gap-3">
        <h3 class="font-semibold text-base truncate-2">${it.name}</h3>
        <span class="badge ${it.purchased ? 'bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-200' : 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200'}">${it.purchased ? 'Purchased' : 'Wanted'}</span>
      </div>
      <div class="text-sm grid grid-cols-2 gap-2">
        <div><span class="text-slate-500">Price:</span> ${formatMoney(it.cost)}</div>
        <div><span class="text-slate-500">Size:</span> ${it.size || '—'}</div>
        <div><span class="text-slate-500">Color:</span> ${it.color || '—'}</div>
        <div class="col-span-2 flex gap-2 items-center">
          <a href="${it.link}" target="_blank" rel="noopener"
             class="underline decoration-white decoration-2 underline-offset-2 truncate hover:opacity-90">
            ${it.linkLabel || 'Product link'}
          </a>
          <button id="copy-${it.id}" class="text-xs px-2 py-1 border rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800">Copy link</button>
        </div>
      </div>
      <div class="mt-1 flex gap-2">
        ${it.purchased ? '' : `<button id="mark-${it.id}" class="flex-1 py-2 rounded-xl bg-indigo-600 text-white font-medium hover:bg-indigo-700">Mark purchased</button>`}
        ${CONFIG.allowUndo && it.purchased ? `<button id="undo-${it.id}" class="flex-1 py-2 rounded-xl border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800">Undo</button>` : ''}
      </div>
    </article>`;
}

function render(){
  const items=getFilteredSorted(state.items);
  $items.innerHTML=items.map(cardHTML).join('');
  for(const it of items){
    document.querySelector(`#mark-${it.id}`)?.addEventListener('click',()=>toggle(it.id,true));
    document.querySelector(`#undo-${it.id}`)?.addEventListener('click',()=>toggle(it.id,false));
    document.querySelector(`#copy-${it.id}`)?.addEventListener('click',()=>copy(it.link));
  }
}

function showSync(text, ok=true){
  if(!$syncStatus) return;
  $syncStatus.textContent = text;
  $syncStatus.className = ok ? 'text-[11px] text-emerald-600' : 'text-[11px] text-amber-600';
}

function toggle(id,purchased){
  const idx=state.items.findIndex(i=>i.id===id); if(idx<0) return;
  state.items[idx].purchased=purchased;
  saveLocal(state);
  render();
  lastPushTs = Date.now();
  saveRemote(state).then(ok=>{ if(ok) showSync('Changes saved for everyone'); });
}

async function copy(text){
  try{ await navigator.clipboard.writeText(text); toast('Link copied'); }
  catch{ toast('Copy failed'); }
}
function toast(msg){
  const el=document.createElement('div');
  el.textContent=msg;
  el.className='fixed left-1/2 -translate-x-1/2 bottom-6 bg-slate-900 text-white text-sm px-3 py-2 rounded-lg shadow-lg';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1400);
}

// ---------- Merge new items from file into remote (keeps purchase states/order) ----------
function mergeInitialIntoRemote(remote){
  const byId = new Map(remote.items.map(i => [i.id, i]));
  let appended = 0;
  for (const it of INITIAL_ITEMS) {
    if (!byId.has(it.id)) {
      remote.items.push(structuredClone(it));
      appended++;
    }
  }
  return { remote, appended };
}

// Poll for remote changes
async function pollRemote(){
  if(document.hidden) return;
  if(Date.now()-lastPushTs < 5000) return;
  const remote = await loadRemote();
  if(remote?.items && Array.isArray(remote.items)){
    const localJson = JSON.stringify(state.items);
    const remoteJson = JSON.stringify(remote.items);
    if(remoteJson !== localJson){
      state = remote;
      saveLocal(state);
      render();
      showSync('Updated just now');
    }
  }
}
function startPolling(){ stopPolling(); pollTimer = setInterval(pollRemote, CONFIG.pollMs); }
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
document.addEventListener('visibilitychange',()=>{ if(document.hidden) stopPolling(); else startPolling(); });

// Setup
async function setup(){
  $items=document.querySelector('#items');
  $search=document.querySelector('#search');
  $sort=document.querySelector('#sort');
  $syncStatus=document.querySelector('#syncStatus');

  $search.addEventListener('input',render);
  $sort.addEventListener('change',render);

  showSync('Syncing…', true);

  const remote = await loadRemote();   // JSONP (no CORS)
  const local  = loadLocal();

  if (remote && Array.isArray(remote.items)){
    // Merge any new items you added in the file into the remote store
    const { remote: merged, appended } = mergeInitialIntoRemote(remote);
    state = merged;
    if (appended > 0) { await saveRemote(state); }
    showSync('Live sync enabled');
  } else if (local && Array.isArray(local.items) && local.items.length){
    state = local;
    const ok = await saveRemote(state);
    showSync(ok ? 'Uploaded your list for everyone' : 'Sync offline – saved on this device', ok);
  } else {
    state = { items: structuredClone(INITIAL_ITEMS) };
    const ok = await saveRemote(state);
    showSync(ok ? 'Live sync enabled' : 'Sync offline – saved on this device', ok);
  }

  render();
  startPolling();
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',setup); else setup();
</script>
</body>
</html>
